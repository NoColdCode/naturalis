org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.9.10-hotspot

# Per-game Fabric versions: fabric-1.21.1/gradle.properties and fabric-1.21.8/gradle.properties (minecraft_version, fabric_loader_version, fabric_api_version).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

