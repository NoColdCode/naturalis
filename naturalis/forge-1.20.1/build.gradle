    filteringCharset = 'UTF-8'
    filter { String line ->
        line
            .replace('net.neoforged.api.distmarker', 'net.minecraftforge.api.distmarker')
            .replace('net.neoforged.bus.api', 'net.minecraftforge.eventbus.api')
            .replace('net.neoforged.fml.common.EventBusSubscriber', 'net.minecraftforge.fml.common.Mod.EventBusSubscriber')
            .replace('net.neoforged.fml.common.Mod', 'net.minecraftforge.fml.common.Mod')
            .replace('net.neoforged.fml.config', 'net.minecraftforge.fml.config')
            .replace('net.neoforged.fml.event', 'net.minecraftforge.fml.event')
            .replace('net.neoforged.fml.ModContainer', 'net.minecraftforge.fml.ModContainer')
            .replace('net.neoforged.neoforge.common.ModConfigSpec', 'net.minecraftforge.common.ForgeConfigSpec')
            .replace('ModConfigSpec', 'ForgeConfigSpec')
            .replace('net.neoforged.fml.loading', 'net.minecraftforge.fml.loading')
            .replace('net.neoforged.neoforge', 'net.minecraftforge')
            .replace('dev.tocraft.', 'tocraft.')
            // MC 1.20.1 compat: ResourceLocation.fromNamespaceAndPath(a, b) -> new ResourceLocation(a, b)
            .replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
            // MC 1.20.1 compat: ResourceLocation.withDefaultNamespace(x) -> new ResourceLocation("minecraft", x)
            .replace('ResourceLocation.withDefaultNamespace(', 'new ResourceLocation("minecraft", ')
            // MC 1.20.1 compat: AdvancementHolder -> Advancement
            .replace('import net.minecraft.advancements.AdvancementHolder;', 'import net.minecraft.advancements.Advancement;')
            .replace('AdvancementHolder ', 'Advancement ')
            // MC 1.20.1 compat: ServerAdvancementManager.get() -> getAdvancement()
            .replace('.getAdvancements().get(', '.getAdvancements().getAdvancement(')
            // MC 1.20.1 compat: CompatAccess.resolveMobEffect returns MobEffect (not Holder<MobEffect>)
            .replace('public static Holder<MobEffect> resolveMobEffect(', 'public static MobEffect resolveMobEffect(')
            .replace('if (primary instanceof Holder<?> holder) {', 'if (primary instanceof MobEffect holder) {')
            .replace('if (fallback instanceof Holder<?> holder) {', 'if (fallback instanceof MobEffect holder) {')
            .replace('return (Holder<MobEffect>) holder;', 'return holder;')
            // MC 1.20.1 compat: EntityDimensions fields are public, not record methods
            .replace('getDimensions().width()', 'getDimensions().width')
            .replace('getDimensions().height()', 'getDimensions().height')
            // MC 1.20.1 compat: NaturalisMobEffects.X is RegistryObject<MobEffect>, needs .get()
            .replace('NaturalisMobEffects.STORM_ATTUNEMENT,', 'NaturalisMobEffects.STORM_ATTUNEMENT.get(),')
            .replace('NaturalisMobEffects.MORPH_BINDING,', 'NaturalisMobEffects.MORPH_BINDING.get(),')
            .replace('NaturalisMobEffects.BREWED_MORPH,', 'NaturalisMobEffects.BREWED_MORPH.get(),')
            .replace('CompatAccess.naturalisMobEffectHolder("storm_attunement")', 'dev.naturalis.content.NaturalisMobEffects.STORM_ATTUNEMENT.get()')
            .replace('CompatAccess.naturalisMobEffectHolder("morph_binding")', 'dev.naturalis.content.NaturalisMobEffects.MORPH_BINDING.get()')
            .replace('public static Holder<MobEffect> naturalisMobEffectHolder(String path) {', 'public static MobEffect naturalisMobEffectHolder(String path) {')
            .replace('return (Holder<MobEffect>) holder;', 'return holder.value();')
            .replace('return (Holder<MobEffect>) h;', 'return (MobEffect) h.value();')
    }
}

/** Line-oriented {@code filter} cannot fix multi-line Holder branches; patch generated CompatAccess after Sync. */
def patchForgeCompatAccess = tasks.register('patchForgeCompatAccess') {
    dependsOn prepareSharedJava
    def compatPath = layout.buildDirectory.file('generated/sources/sharedMain/java/dev/naturalis/compat/CompatAccess.java')
    outputs.file(compatPath)
    doLast {
        def f = compatPath.get().asFile
        if (!f.exists()) {
            return
        }
        String text = f.getText('UTF-8')
        text = text.replaceAll(/optional\.orElse\(null\) instanceof Holder<\?> holder\) \{\s+return holder\.value\(\);\s+\}/,
            'optional.orElse(null) instanceof Holder<?> holder) {\n                return (MobEffect) holder.value();\n            }')
        text = text.replaceAll(/optional\.orElse\(null\) instanceof Holder<\?> holder\) \{\s+return holder;\s+\}/,
            'optional.orElse(null) instanceof Holder<?> holder) {\n                return (MobEffect) holder.value();\n            }')
        text = text.replaceAll(/if \(holder instanceof Holder<\?> h\) \{\s+return h\.value\(\);\s+\}/,
            'if (holder instanceof Holder<?> h) {\n                return (MobEffect) h.value();\n            }')
        f.write(text, 'UTF-8')
    }
}

def patchForgeNaturalisConfig = tasks.register('patchForgeNaturalisConfig') {
    dependsOn prepareSharedJava
    def configPath = layout.buildDirectory.file('generated/sources/sharedMain/java/dev/naturalis/config/NaturalisConfig.java')
    outputs.file(configPath)
    doLast {
        def f = configPath.get().asFile
        if (!f.exists()) {
            return
        }
        String text = f.getText('UTF-8')
        text = text.replaceAll(/import net\.minecraftforge\.client\.gui\.ConfigurationScreen;\r?\n/, '')
        text = text.replaceAll(/import net\.minecraftforge\.client\.gui\.IConfigScreenFactory;\r?\n/, '')
        text = text.replaceAll(
            /\s*\/\/ Required for the "Config" button in Mods → Naturalis \(registerConfig alone is not enough\)\.\r?\n\s*container\.registerExtensionPoint\(\r?\n\s*IConfigScreenFactory\.class,\r?\n\s*\(minecraft, parent\) -> new ConfigurationScreen\(container, parent\)\r?\n\s*\);\r?\n/,
            '\n'
        )
        text = text.replaceAll(
            /public static void register\(ModContainer container\) \{\r?\n\s*container\.registerConfig\(ModConfig\.Type\.COMMON, COMMON_SPEC, NaturalisMod\.ID \+ "-common\.toml"\);\r?\n\s*container\.registerConfig\(ModConfig\.Type\.CLIENT, CLIENT_SPEC, NaturalisMod\.ID \+ "-client\.toml"\);\r?\n\s*\}/,
            'public static void register() {\n        net.minecraftforge.fml.ModLoadingContext.get().registerConfig(ModConfig.Type.COMMON, COMMON_SPEC);\n        net.minecraftforge.fml.ModLoadingContext.get().registerConfig(ModConfig.Type.CLIENT, CLIENT_SPEC);\n    }'
        )
        f.write(text, 'UTF-8')
    }
}

sourceSets {
    main {
        java.srcDir prepareSharedJava
        java.srcDir 'src/main/java'
        // Forge recipe JSON overrides must win over common 1.21-format recipes.
        resources.srcDir 'src/main/resources'
        resources.srcDir '../common/src/main/resources'
        resources.srcDir 'src/generated/resources'
    }
}

tasks.named('compileJava').configure {
    dependsOn patchForgeCompatAccess, patchForgeNaturalisConfig
}

tasks.named('processResources').configure {
    dependsOn tasks.named('compileJava')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(layout.buildDirectory.dir('mixin')) {
        include 'naturalis.mixins.refmap.json'
    }
}

legacyForge {
    enable {
        forgeVersion = project.forge_version
    }

    runs {
        client {
            client()
            jvmArguments.add('-XX:TieredStopAtLevel=1')
            jvmArguments.add('-XX:ReservedCodeCacheSize=256m')
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // Mixin config comes from mixin { config } + mods.toml only.
            // Do NOT also pass --mixin.config here — duplicate args make Mixin fail with
            // "naturalis.mixins.json was invalid or could not be read".
            if (project.findProperty('instinctDebug') == 'true') {
                jvmArguments.add('-Dnaturalis.instinct.debug=true')
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    modImplementation "dev.tocraft:craftedcore-forge:${craftedcore_version}"
    modImplementation "dev.tocraft:walkers-forge:${walkers_version}"
    modImplementation "dev.tocraft:remorphed-forge:${remorphed_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'naturalis.mixins.refmap.json'
    config 'naturalis.mixins.json'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'MixinConfigs': 'naturalis.mixins.json'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
