name: Naturalis multi-loader compile

on:
  push:
    paths:
      - 'naturalis/**'
      - '.github/workflows/naturalis-fabric.yml'
  pull_request:
    paths:
      - 'naturalis/**'
      - '.github/workflows/naturalis-fabric.yml'

defaults:
  run:
    working-directory: naturalis

jobs:
  compile-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile all loaders
        run: >
          ./gradlew --no-daemon
          :neoforge-1.21.1:compileJava
          :neoforge-1.21.8:compileJava
          :forge-1.20.1:compileJava
          :fabric-1.21.1:compileJava
          :fabric-1.21.8:compileJava
